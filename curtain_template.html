<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bead curtain</title>
<style>
  :root{
    --paper:#f4efe4;
    --ink:#14110c; --ink-2:#574f42; --ink-3:#8d8475;
    --rule:rgba(20,17,12,0.16); --rule-firm:rgba(20,17,12,0.82);
    --pad:clamp(14px, 3vw, 34px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:var(--paper);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--ink); font-feature-settings:"tnum" 1;}

  /* The whole piece sits in one centred measure with air around it. */
  #page{height:100%; max-width:1180px; margin:0 auto; padding:var(--pad) var(--pad) 0;
    display:flex; flex-direction:column;}

  /* ---- masthead ---- */
  #mast{flex:0 0 auto; padding-bottom:9px; border-bottom:1px solid var(--rule-firm);}
  #mast h1{margin:0; font-size:clamp(25px, 4.2vw, 37px); font-weight:640;
    letter-spacing:-0.033em; line-height:0.96;}
  #mast .stand{margin:7px 0 0; max-width:52ch; font-size:12.5px; line-height:1.4; color:var(--ink-2);}
  #mast .dek{margin-top:7px; display:flex; gap:16px; flex-wrap:wrap;}

  .lbl{font-size:9.5px; font-weight:650; letter-spacing:0.155em; text-transform:uppercase; color:var(--ink-3);}

  /* ---- the piece ---- */
  #stage{flex:1 1 auto; min-height:0; position:relative;}
  canvas#cv{position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none;}

  #zoom{position:absolute; right:0; bottom:0; z-index:12; display:flex;}
  #zoom button{width:31px; height:31px; border:1px solid var(--rule); border-left-width:0;
    background:rgba(244,239,228,0.9); color:var(--ink-2); font-size:14px; line-height:1;
    cursor:pointer; font-family:inherit;}
  #zoom button:first-child{border-left-width:1px;}
  #zoom button:hover{background:rgba(20,17,12,0.06); color:var(--ink);}

  /* ---- caption ---- */
  #caption{flex:0 0 auto; border-top:1px solid var(--rule-firm);
    padding:8px 0 calc(10px + env(safe-area-inset-bottom));}
  #capTop{display:flex; justify-content:space-between; align-items:baseline; gap:16px;}
  #hint{color:var(--ink-3); font-size:10.5px; letter-spacing:0.01em; transition:opacity .6s; text-align:right;}

  #legend{display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin-top:7px;}
  .lg{display:flex; align-items:baseline; gap:7px; font-size:12.5px; color:var(--ink);}
  .lg canvas{width:13px; height:auto; display:block; align-self:center;}
  .lg .n{color:var(--ink-3); font-size:11px;}

  #subkey{display:flex; gap:5px 18px; flex-wrap:wrap; margin-top:6px;
    font-size:10.5px; color:var(--ink-3);}
  #subkey b{font-weight:600; color:var(--ink-2);}

  /* ---- detail ---- */
  #sheet{position:fixed; left:var(--pad); right:var(--pad); bottom:0; z-index:20;
    background:var(--paper); border:1px solid var(--rule-firm); border-bottom:0;
    padding:15px 18px 17px; max-width:480px; margin:0 auto;
    transform:translateY(102%); transition:transform .28s cubic-bezier(.2,.85,.25,1);}
  #sheet.show{transform:translateY(0);}
  #sheet .hd{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    padding-bottom:11px; margin-bottom:3px; border-bottom:1px solid var(--rule);}
  #sheet .tm{font-size:17px; font-weight:620; letter-spacing:-0.02em;}
  #sheet .mt{margin-top:4px;}
  #sheet .cl{border:1px solid var(--rule); background:none; color:var(--ink-2);
    width:25px; height:25px; font-size:13px; line-height:1; cursor:pointer; flex:0 0 auto; font-family:inherit;}
  #sheet .cl:hover{background:rgba(20,17,12,0.06); color:var(--ink);}
  #rows{display:grid; grid-template-columns:auto 1fr; font-size:12.5px;}
  #rows > div{padding:4.5px 0; border-bottom:1px solid var(--rule);}
  #rows > div:nth-last-child(-n+2){border-bottom:0;}
  #rows .k, #rows .v{align-self:center;}
  #rows .v{text-align:right; font-weight:530;}
</style>
</head>
<body>
<div id="page">

  <header id="mast">
    <h1>Bead curtain</h1>
    <p class="stand">Every bead is one prompt. Every strand is one session, read top to
      bottom in the order it was typed.</p>
    <div class="dek">
      <span class="lbl" id="mCount">&nbsp;</span>
      <span class="lbl">10 Jun &ndash; 5 Oct 2026</span>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoom">
      <button id="zOut" aria-label="Zoom out">&minus;</button>
      <button id="zIn" aria-label="Zoom in">+</button>
      <button id="zFit" aria-label="Fit whole curtain">&#9633;</button>
    </div>
  </div>

  <footer id="caption">
    <div id="capTop">
      <span class="lbl">Phase</span>
      <span id="hint">drag the strands &middot; pinch to zoom &middot; tap a bead</span>
    </div>
    <div id="legend"></div>
    <div id="subkey"></div>
  </footer>

</div>

<div id="sheet">
  <div class="hd">
    <div><div class="tm" id="shTime">&nbsp;</div><div class="mt lbl" id="shMeta">&nbsp;</div></div>
    <button class="cl" id="shClose" aria-label="Close">&times;</button>
  </div>
  <div id="rows"></div>
</div>

<script>
/*__DATA__*/

/* ---------- fixed structure ---------- */
// STRAND_GAP against W is what decides whether this reads as a curtain or as a
// scatter of columns: at 34 the bead filled 41% of its slot and the paper
// between strands dominated. Tightening it trades a little vertical reach for
// density — see the note on fit() for why width is the binding dimension.
const W = 14, STRAND_GAP = 30, MARGIN = 30, HANGER_Y = 22, PAD_W = 7;
// Bead lengths and pause gaps are both on a compressed vertical scale. One
// 98-prompt session is nearly four times the median strand, and at full scale
// it stretched the world so tall that fitting it left the curtain stranded in
// the middle of the screen. Shortening both keeps every relationship intact
// (longer prompt is still a longer bead, longer pause still more bare cord)
// while bringing the whole piece closer to the shape of a screen.
//
// L_MIN cannot go much below this: a <=5 word prompt is a circle of diameter W,
// so beadLen(6) has to stay above W or a 6-word bead would read as shorter than
// a 5-word one. That floor is what sets the height of the whole piece.
const L_MIN = 10, L_MAX = 29, L_K = 18;
const SHAPE_CIRCLE = 0, SHAPE_PILL = 1, SHAPE_DIAMOND = 2, SHAPE_TUBE = 3;
const SHAPE_NAMES = ['seed (circle)','barrel (pill)','faceted (diamond)','tube'];

function beadLen(wc){ return L_MIN + (L_MAX - L_MIN) * (1 - Math.exp(-wc / L_K)); }
function beadShape(wc){ return wc <= 5 ? SHAPE_CIRCLE : wc <= 15 ? SHAPE_PILL : wc <= 40 ? SHAPE_DIAMOND : SHAPE_TUBE; }
function beadGap(g){ return g < 0 ? 0 : 1.5 + 8 * (1 - Math.exp(-g / 1000)); }

function rnd(seed){ let x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }

/* ---------- build beads + strands ---------- */
const beads = [], strands = [];
for (let i = 0; i < SESSIONS.length; i++)
  strands.push({ x: MARGIN + i * STRAND_GAP, len: 0, a: 0, v: 0, lastClick: 0 });

let worldH = 0;
{
  const cursor = new Float64Array(SESSIONS.length).fill(HANGER_Y);
  for (let i = 0; i < ROWS.length; i++) {
    const r = ROWS[i], sid = r[0], wc = r[4];
    const L = beadShape(wc) === SHAPE_CIRCLE ? W : beadLen(wc);
    cursor[sid] += beadGap(r[11]);
    const depth = cursor[sid] + L / 2 - HANGER_Y;
    cursor[sid] += L;
    const t = r[2] > 1 ? r[1] / (r[2] - 1) : 0;
    beads.push({
      id: i, sid: sid, ord: r[1], slen: r[2], ts: r[3], wc: wc,
      phase: r[5], clarity: r[6], spec: r[7], ground: r[8], bundle: r[9], hour: r[10], gap: r[11],
      L: L, shape: beadShape(wc), depth: depth,
      fat: t, fatIdx: t < 1 / 3 ? 0 : t < 2 / 3 ? 1 : 2,
      bright: Math.floor(rnd(i * 1.7 + 3) * 3),
      tilt: (rnd(i * 2.3 + 11) - 0.5) * 0.055
    });
  }
  for (let i = 0; i < SESSIONS.length; i++) {
    strands[i].len = cursor[i] - HANGER_Y;
    if (cursor[i] > worldH) worldH = cursor[i];
  }
}
const worldW = MARGIN * 2 + (SESSIONS.length - 1) * STRAND_GAP + W;
worldH += 30;
for (const b of beads) beads[b.id].strand = strands[b.sid];

/* ---------- colour helpers ---------- */
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function sh(hex, amt){
  const c = hex2rgb(hex);
  const m = amt >= 0 ? 255 : 0, k = Math.abs(amt);
  return '#' + c.map(v => Math.round(v + (m - v) * k).toString(16).padStart(2, '0')).join('');
}
function mix(h1, h2, t){
  const a = hex2rgb(h1), b = hex2rgb(h2);
  return '#' + a.map((v,i) => Math.round(v + (b[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function hexa(hex, a){
  const c = hex2rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
const BRIGHT = [-0.06, 0, 0.07];

/* ---------- the single encoding ----------
   One curtain. Every bead carries all five visible channels at once, so the
   whole dataset is readable without switching anything. Each channel owns a
   different property of the glass, which is what lets them stack:

     phase        -> the colour of the glass
     clarity      -> how polished it is (specular + surface pitting)
     specificity  -> how dense it is (a vague prompt is a thinner, paler bead)
     groundedness -> an inclusion: white fleck or a gold band
     bundling     -> facet lines cut across the body

   Decision fatigue and hour of day both wanted colour, which phase already
   owns, so they live in the tap sheet rather than on the bead. */

// Each phase is a different stone. tint = where the light enters, base = body,
// deep = the dense shadowed edge, caustic = the pool of light that makes it
// through the glass and lands inside.
const GLASS = [
  { base:'#3C8BD9', tint:'#CFE2FF', deep:'#0D2550', caustic:'#7FB8FF' }, // UI     — sapphire
  { base:'#8C8A84', tint:'#EFEBE1', deep:'#2B2823', caustic:'#CFC9BC' }, // Setup  — smoky quartz
  { base:'#DC4E4D', tint:'#FFCCC0', deep:'#4F1210', caustic:'#FF8E76' }, // Bugs   — garnet
  { base:'#8077DE', tint:'#DCD5FF', deep:'#241D5C', caustic:'#AEA2FF' }, // UX     — amethyst
];

function beadStyle(b){
  return {
    g: GLASS[b.phase],
    gloss:   [0.95, 0.5, 0.12][b.clarity],
    speckle: b.clarity === 2,
    alpha:   [1, 0.88, 0.7, 0.5][b.spec],
    fleck:   b.ground === 1,
    band:    b.ground === 2,
    facets:  [0, 2, 4][b.bundle],
    vk: 'p'+b.phase+'c'+b.clarity+'s'+b.spec+'g'+b.ground+'b'+b.bundle
  };
}

/* ---------- shape path ---------- */
function shapePath(x, w, h, shape){
  x.beginPath();
  if (shape === SHAPE_CIRCLE){ x.arc(0, 0, w/2, 0, Math.PI*2); x.closePath(); return; }
  if (shape === SHAPE_DIAMOND){
    const s = Math.min(h*0.3, w*1.15);
    x.moveTo(0, -h/2);
    x.lineTo(w/2, -h/2 + s); x.lineTo(w/2, h/2 - s);
    x.lineTo(0, h/2);
    x.lineTo(-w/2, h/2 - s); x.lineTo(-w/2, -h/2 + s);
    x.closePath(); return;
  }
  const r = w/2;
  x.moveTo(-r, -h/2 + r);
  x.arc(0, -h/2 + r, r, Math.PI, 0);
  x.lineTo(r, h/2 - r);
  x.arc(0, h/2 - r, r, 0, Math.PI);
  x.closePath();
}

/* ---------- sprite cache ---------- */
const SCALES = [0.6, 0.9, 1.3, 1.8, 2.4, 3.2];
const cache = new Map();

function makeSprite(L, shape, st, bright, s){
  const h = L, w = W, pad = Math.ceil(PAD_W * s);
  const cw = Math.ceil(w*s) + pad*2, ch = Math.ceil(h*s) + pad*2;
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const x = c.getContext('2d');
  x.translate(cw/2, ch/2); x.scale(s, s);

  const alpha = st.alpha === undefined ? 1 : st.alpha;
  const k = BRIGHT[bright];
  const base = sh(st.g.base, k);
  const tint = sh(st.g.tint, k*0.6);
  const caus = sh(st.g.caustic, k*0.6);
  const deep = st.g.deep;
  const gl = st.gloss === undefined ? 0.3 : st.gloss;

  // The shadow this bead throws, plus a paper-coloured backing. The backing is
  // what a thin bead washes out against, so low specificity reads as pale
  // rather than dark — the right direction on a light ground.
  x.save();
  x.shadowColor = 'rgba(74,57,34,' + (0.30*alpha + 0.08) + ')';
  x.shadowBlur = 5; x.shadowOffsetX = 1.4; x.shadowOffsetY = 2.2;
  x.fillStyle = 'rgba(247,242,232,0.94)';
  shapePath(x, w, h, shape); x.fill();
  x.restore();

  x.save();
  x.globalAlpha = alpha;
  shapePath(x, w, h, shape); x.clip();

  // Body. A round bar of glass lit from the upper left: the edges are dense and
  // dark because you are looking through the most material there, the middle is
  // where light gets through, and the far edge picks the light back up.
  const g = x.createLinearGradient(-w/2, 0, w/2, 0);
  g.addColorStop(0.00, mix(deep, tint, 0.30));
  g.addColorStop(0.08, deep);
  g.addColorStop(0.22, mix(base, tint, 0.50));
  g.addColorStop(0.40, base);
  g.addColorStop(0.62, mix(base, deep, 0.34));
  g.addColorStop(0.85, deep);
  g.addColorStop(1.00, mix(deep, tint, 0.42));
  x.fillStyle = g;
  x.fillRect(-w/2, -h/2, w, h);

  // The caustic: light that passed through the glass and pooled inside it,
  // offset down and away from the key light.
  const ccx = w*0.17, ccy = h*0.13, ccr = Math.max(w*0.66, h*0.27);
  const cg = x.createRadialGradient(ccx, ccy, 0, ccx, ccy, ccr);
  cg.addColorStop(0.00, hexa(caus, 0.46 + gl*0.26));
  cg.addColorStop(0.45, hexa(caus, 0.15 + gl*0.10));
  cg.addColorStop(1.00, hexa(caus, 0));
  x.fillStyle = cg;
  x.fillRect(-w/2, -h/2, w, h);

  // Ends go dark — more glass to see through end-on, and the drill hole is there.
  const es = Math.min(0.3, w/h*0.62);
  const vg = x.createLinearGradient(0, -h/2, 0, h/2);
  vg.addColorStop(0, 'rgba(0,0,0,0.58)');
  vg.addColorStop(es, 'rgba(0,0,0,0)');
  vg.addColorStop(1-es, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.64)');
  x.fillStyle = vg;
  x.fillRect(-w/2, -h/2, w, h);

  // The specular — the hard little window of reflected sky. This is the one
  // mark that reads unmistakably as glass, so clarity drives its size and bite:
  // tight and bright on a polished bead, smeared and dull on a pitted one.
  if (gl > 0.02){
    const hx = -w*0.22, hy = -h/2 + Math.max(w*0.62, h*0.18);
    const bloom = x.createRadialGradient(hx, hy, 0, hx, hy, Math.max(w*0.52, h*0.17));
    bloom.addColorStop(0, 'rgba(255,255,255,' + (0.09 + gl*0.32) + ')');
    bloom.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = bloom;
    x.fillRect(-w/2, -h/2, w, h);

    const hw = w*0.075 * (1 + (1-gl)*1.6);
    const hh = Math.min(h*0.085, w*0.26) * (1 + (1-gl)*0.9);
    x.fillStyle = 'rgba(255,255,255,' + (0.22 + gl*0.52) + ')';
    x.beginPath(); x.ellipse(hx, hy, hw, hh, -0.1, 0, Math.PI*2); x.fill();

    // a second, weaker window low on the opposite face
    if (gl > 0.4){
      x.fillStyle = 'rgba(255,255,255,' + (gl*0.18) + ')';
      x.beginPath();
      x.ellipse(w*0.21, h/2 - Math.max(w*0.62, h*0.2), w*0.065, Math.min(h*0.075, w*0.2), 0.2, 0, Math.PI*2);
      x.fill();
    }
  }

  if (st.speckle){
    x.fillStyle = 'rgba(0,0,0,0.3)';
    for (let i = 0; i < 9; i++){
      const px = (rnd(i*3.1 + 0.7) - 0.5) * w * 0.74;
      const py = (rnd(i*5.9 + 2.3) - 0.5) * h * 0.82;
      x.beginPath(); x.arc(px, py, 0.42 + rnd(i*7.3)*0.3, 0, Math.PI*2); x.fill();
    }
  }

  if (st.facets){
    const n = st.facets;
    for (let i = 1; i <= n; i++){
      const fy = -h/2 + (h * i) / (n + 1);
      x.strokeStyle = 'rgba(255,255,255,0.14)'; x.lineWidth = 0.5;
      x.beginPath(); x.moveTo(-w/2, fy); x.lineTo(w/2, fy); x.stroke();
      x.strokeStyle = 'rgba(0,0,0,0.26)'; x.lineWidth = 0.5;
      x.beginPath(); x.moveTo(-w/2, fy + 0.6); x.lineTo(w/2, fy + 0.6); x.stroke();
    }
  }

  if (st.band){
    const bh = Math.max(2.2, h*0.08);
    const bg = x.createLinearGradient(-w/2, 0, w/2, 0);
    bg.addColorStop(0, 'rgba(120,88,20,0.9)');
    bg.addColorStop(0.3, 'rgba(250,210,130,0.95)');
    bg.addColorStop(0.65, 'rgba(198,146,46,0.9)');
    bg.addColorStop(1, 'rgba(96,68,14,0.9)');
    x.fillStyle = bg;
    x.fillRect(-w/2, -bh/2, w, bh);
  }

  if (st.fleck){
    const fx = w*0.1, fy = -h/2 + Math.max(w*0.75, h*0.3);
    x.fillStyle = 'rgba(255,252,240,0.95)';
    x.beginPath(); x.arc(fx, fy, Math.max(0.9, w*0.085), 0, Math.PI*2); x.fill();
    x.fillStyle = 'rgba(255,252,240,0.3)';
    x.beginPath(); x.arc(fx, fy, Math.max(1.8, w*0.16), 0, Math.PI*2); x.fill();
  }

  x.restore();

  // Rim. A dark contact edge keeps the silhouette crisp against the bead
  // behind it; the bright gradient on top is the light grazing round the
  // curve, which is what gives the bead its roundness.
  x.save();
  x.globalAlpha = alpha;
  x.strokeStyle = 'rgba(0,0,0,0.38)'; x.lineWidth = 0.55;
  shapePath(x, w, h, shape); x.stroke();

  x.globalAlpha = alpha * (0.28 + gl*0.38);
  const rl = x.createLinearGradient(-w/2, -h/2, w/2, h/2);
  rl.addColorStop(0.00, hexa(tint, 0.62));
  rl.addColorStop(0.40, hexa(tint, 0.06));
  rl.addColorStop(1.00, hexa(tint, 0.42));
  x.strokeStyle = rl; x.lineWidth = 0.6;
  shapePath(x, w, h, shape); x.stroke();
  x.restore();

  return { c: c, ww: cw/s, wh: ch/s };
}

function getSprite(b, s){
  const st = beadStyle(b);
  const lb = Math.round(b.L / 1.5);
  const key = st.vk + '|' + b.shape + '|' + lb + '|' + b.bright + '|' + s;
  let sp = cache.get(key);
  if (!sp){
    if (cache.size > 4000) cache.clear();
    sp = makeSprite(lb * 1.5, b.shape, st, b.bright, s);
    cache.set(key, sp);
  }
  return sp;
}

/* ---------- camera ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let dpr = 1, cvw = 0, cvh = 0;
const cam = { x: worldW/2, y: worldH/2, z: 1 };
let minZ = 0.1;
const Z_MAX = 2.4;   // close enough to read one bead; far less than the old 6x

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cvw = cv.clientWidth; cvh = cv.clientHeight;
  syncRect();
  cv.width = Math.round(cvw*dpr); cv.height = Math.round(cvh*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Zoom out stops once the curtain spans the full width. Fitting the height
  // as well would shrink it to a column with bare paper down both sides, and
  // the curtain is taller than it is wide, so width is the binding edge.
  minZ = cvw/worldW;
  if (cam.z < minZ) cam.z = minZ;
  draw();
}
// Reset: full width, rod tucked just under the top edge. The bottom of the one
// very long strand falls past the frame — pan down for it.
function fit(){
  cam.z = minZ;
  cam.x = worldW/2;
  cam.y = HANGER_Y + (cvh/2 - 10)/cam.z;
  clampCam(); draw();
}
function clampCam(){
  const vw = cvw/cam.z, vh = cvh/cam.z;
  // no horizontal slack — paper must never show at the sides
  if (worldW <= vw) cam.x = worldW/2;
  else cam.x = Math.max(vw/2, Math.min(worldW - vw/2, cam.x));
  if (worldH < vh) cam.y = worldH/2;
  else cam.y = Math.max(vh/2 - 40, Math.min(worldH - vh/2 + 60, cam.y));
}
const s2wx = sx => (sx - cvw/2)/cam.z + cam.x;
const s2wy = sy => (sy - cvh/2)/cam.z + cam.y;

function pickScale(){
  const want = cam.z * dpr;
  for (const s of SCALES) if (s >= want) return s;
  return SCALES[SCALES.length-1];
}

/* ---------- strand geometry ---------- */
function angAt(st, depth){
  const f = st.len > 0 ? depth/st.len : 0;
  return st.a * (0.3 + 0.7*f);
}

/* ---------- draw ---------- */
let needs = true, lastT = 0;
function draw(){ needs = true; }

function render(t){
  const dt = t - lastT;
  let moving = false;
  for (const st of strands){
    st.v += -0.0042 * st.a;
    st.v *= 0.982;
    st.a += st.v;
    if (st.a > 0.45){ st.a = 0.45; if (st.v > 0) st.v = 0; }
    else if (st.a < -0.45){ st.a = -0.45; if (st.v < 0) st.v = 0; }
    if (Math.abs(st.a) > 1e-4 || Math.abs(st.v) > 1e-5) moving = true;
  }
  if (!needs && !moving){ requestAnimationFrame(render); return; }
  if (dt < 22 && !dragging){ requestAnimationFrame(render); return; }
  lastT = t; needs = false;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = ctx.createRadialGradient(cvw*0.34, cvh*0.2, 10, cvw*0.5, cvh*0.55, Math.max(cvw,cvh)*1.05);
  bg.addColorStop(0, '#f8f4ea'); bg.addColorStop(0.55, '#f4efe4'); bg.addColorStop(1, '#ece5d7');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cvw, cvh);

  const z = cam.z;
  const ox = cvw/2 - cam.x*z, oy = cvh/2 - cam.y*z;
  const w2x = wx => wx*z + ox, w2y = wy => wy*z + oy;

  ctx.fillStyle = 'rgba(80,62,40,0.14)';
  ctx.fillRect(0, w2y(HANGER_Y) - 3*z, cvw, 7*z);
  const hg = ctx.createLinearGradient(0, w2y(HANGER_Y) - 4*z, 0, w2y(HANGER_Y) + 4*z);
  hg.addColorStop(0, '#8a6b47'); hg.addColorStop(0.4, '#c4a67c'); hg.addColorStop(1, '#5c452d');
  ctx.fillStyle = hg;
  ctx.fillRect(0, w2y(HANGER_Y) - 2.2*z, cvw, 4.6*z);

  const padX = 60, padY = 80;

  // The cord is drawn twice: once behind the beads, then again over them at a
  // fraction of the strength. The second pass is the part of the string you can
  // see through the glass, which is what makes one continuous cord out of what
  // would otherwise look like two stubs poking out of a hole at each end.
  function drawCords(width, style){
    ctx.strokeStyle = style;
    ctx.lineWidth = width;
    for (const st of strands){
      const sxTop = w2x(st.x);
      if (sxTop < -padX || sxTop > cvw + padX) continue;
      ctx.beginPath();
      const step = Math.max(24, 70/Math.max(z, 0.08));
      for (let d = 0; d <= st.len; d += step){
        const a = angAt(st, d);
        const px = w2x(st.x + Math.sin(a)*d), py = w2y(HANGER_Y + Math.cos(a)*d);
        d === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      const aE = angAt(st, st.len);
      ctx.lineTo(w2x(st.x + Math.sin(aE)*st.len), w2y(HANGER_Y + Math.cos(aE)*st.len));
      ctx.stroke();
    }
  }
  drawCords(Math.max(0.5, 1.1*z), 'rgba(116,97,70,0.42)');

  // Below this the beads are drawn as plain rects. It has to sit under the
  // fit-width zoom or the opening view — the one everybody sees — would be
  // blocks rather than glass.
  const far = z < 0.2;
  const s = far ? 0 : pickScale();

  for (const b of beads){
    const st = b.strand;
    const a = angAt(st, b.depth);
    const wx = st.x + Math.sin(a)*b.depth, wy = HANGER_Y + Math.cos(a)*b.depth;
    const sx = w2x(wx), sy = w2y(wy);
    if (sx < -padX || sx > cvw + padX || sy < -padY || sy > cvh + padY) continue;
    const rot = a + b.tilt;

    if (far){
      const stl = beadStyle(b);
      ctx.globalAlpha = stl.alpha === undefined ? 1 : stl.alpha;
      ctx.fillStyle = sh(stl.g.base, BRIGHT[b.bright]);
      const dw = Math.max(1, W*z), dh = Math.max(1, b.L*z);
      ctx.fillRect(sx - dw/2, sy - dh/2, dw, dh);
      ctx.globalAlpha = 1;
      continue;
    }

    const sp = getSprite(b, s);
    const dw = sp.ww*z, dh = sp.wh*z;
    if (Math.abs(rot) < 0.01){
      ctx.drawImage(sp.c, sx - dw/2, sy - dh/2, dw, dh);
    } else {
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot);
      ctx.drawImage(sp.c, -dw/2, -dh/2, dw, dh);
      ctx.restore();
    }
  }

  // the cord seen through the glass
  if (!far) drawCords(Math.max(0.4, 0.7*z), 'rgba(58,45,30,0.11)');

  if (sel){
    const st = sel.strand;
    const a = angAt(st, sel.depth);
    const sx = w2x(st.x + Math.sin(a)*sel.depth), sy = w2y(HANGER_Y + Math.cos(a)*sel.depth);
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(a + sel.tilt);
    ctx.strokeStyle = 'rgba(40,30,18,0.85)';
    ctx.lineWidth = Math.max(1, 1.6*Math.min(z,2));
    const m = 3.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, (W/2+m)*z, (sel.L/2+m)*z, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  requestAnimationFrame(render);
}

/* ---------- audio ---------- */
let actx = null, lastClick = 0;
function unlock(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function clickSound(vol){
  if (!actx || actx.state !== 'running') return;
  const now = performance.now();
  if (now - lastClick < 48) return;
  lastClick = now;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.value = 760 + Math.random()*900;
  f.type = 'bandpass'; f.frequency.value = 1500 + Math.random()*900; f.Q = 1.1;
  const v = Math.min(0.2, vol);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
  o.connect(f); f.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.09);
}

/* ---------- interaction ---------- */
// The canvas is inset inside the page, so pointer events have to be moved out
// of viewport space before any of the camera maths touches them.
let cvLeft = 0, cvTop = 0;
function syncRect(){ const r = cv.getBoundingClientRect(); cvLeft = r.left; cvTop = r.top; }
const ex = e => e.clientX - cvLeft, ey = e => e.clientY - cvTop;

const ptrs = new Map();
let dragging = false, moved = 0, downX = 0, downY = 0, pinchD = 0, pinchZ = 1, pinchMid = null;

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  syncRect();
  ptrs.set(e.pointerId, { x: ex(e), y: ey(e) });
  unlock();
  if (ptrs.size === 1){ dragging = true; moved = 0; downX = ex(e); downY = ey(e); }
  else if (ptrs.size === 2){
    const p = [...ptrs.values()];
    pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    pinchZ = cam.z;
    pinchMid = { x: (p[0].x + p[1].x)/2, y: (p[0].y + p[1].y)/2 };
    pinchMid.wx = s2wx(pinchMid.x); pinchMid.wy = s2wy(pinchMid.y);
  }
});

cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = ex(e) - p.x, dy = ey(e) - p.y;
  p.x = ex(e); p.y = ey(e);

  if (ptrs.size >= 2){
    const q = [...ptrs.values()];
    const d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y);
    if (pinchD > 0){
      cam.z = Math.max(minZ, Math.min(Z_MAX, pinchZ * (d/pinchD)));
      const mx = (q[0].x + q[1].x)/2, my = (q[0].y + q[1].y)/2;
      cam.x = pinchMid.wx - (mx - cvw/2)/cam.z;
      cam.y = pinchMid.wy - (my - cvh/2)/cam.z;
      clampCam(); draw();
    }
    return;
  }

  moved += Math.abs(dx) + Math.abs(dy);
  cam.x -= dx/cam.z; cam.y -= dy/cam.z;
  clampCam();

  const pwx = s2wx(ex(e));
  const reach = Math.max(170, 150/cam.z);
  const imp = Math.max(-0.03, Math.min(0.03, dx * 0.0009));
  if (Math.abs(imp) > 1e-5){
    for (const st of strands){
      const prox = Math.max(0, 1 - Math.abs(st.x - pwx)/reach);
      if (prox <= 0) continue;
      st.v += imp * prox * (0.55 + 0.45*Math.min(1, st.len/2200));
      st.v = Math.max(-0.05, Math.min(0.05, st.v));
      const sp = Math.abs(st.v);
      if (sp > 0.004 && performance.now() - st.lastClick > 160){
        st.lastClick = performance.now();
        clickSound(Math.min(0.16, sp*2.4) * prox);
      }
    }
  }
  draw();
});

function up(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2){ pinchD = 0; pinchMid = null; }
  if (ptrs.size === 0){
    if (dragging && moved < 9) pick(downX, downY);
    dragging = false;
  }
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

cv.addEventListener('wheel', e => {
  e.preventDefault();
  unlock();
  syncRect();
  const px = ex(e), py = ey(e);
  const wx = s2wx(px), wy = s2wy(py);
  const f = Math.exp(-e.deltaY * 0.0016);
  cam.z = Math.max(minZ, Math.min(Z_MAX, cam.z * f));
  cam.x = wx - (px - cvw/2)/cam.z;
  cam.y = wy - (py - cvh/2)/cam.z;
  clampCam(); draw();
}, { passive: false });

/* ---------- pick + sheet ---------- */
let sel = null;
const sheet = document.getElementById('sheet');

function pick(sx, sy){
  const tol = 5/cam.z;
  let best = null, bestD = Infinity;
  for (const b of beads){
    const st = b.strand;
    const a = angAt(st, b.depth);
    const wx = st.x + Math.sin(a)*b.depth, wy = HANGER_Y + Math.cos(a)*b.depth;
    const px = w2sx(wx), py = w2sy(wy);
    const ddx = (sx - px)/cam.z, ddy = (sy - py)/cam.z;
    const r = -(a + b.tilt);
    const lx = ddx*Math.cos(r) - ddy*Math.sin(r);
    const ly = ddx*Math.sin(r) + ddy*Math.cos(r);
    const ax = Math.abs(lx) - (W/2 + tol), ay = Math.abs(ly) - (b.L/2 + tol);
    if (ax <= 0 && ay <= 0){
      const d = Math.max(ax, ay);
      if (d < bestD){ bestD = d; best = b; }
    }
  }
  if (best){ sel = best; showSheet(best); clickSound(0.08); }
  else { sel = null; sheet.classList.remove('show'); }
  draw();
}
function w2sx(wx){ return wx*cam.z + (cvw/2 - cam.x*cam.z); }
function w2sy(wy){ return wy*cam.z + (cvh/2 - cam.y*cam.z); }

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtGap(g){
  if (g < 0) return 'first of session';
  if (g < 60) return g + 's';
  if (g < 3600) return Math.round(g/60) + ' min';
  return (g/3600).toFixed(1) + ' h';
}
function showSheet(b){
  const mo = parseInt(b.ts.slice(0,2),10), da = parseInt(b.ts.slice(3,5),10);
  document.getElementById('shTime').textContent = da + ' ' + MONTHS[mo-1] + ' 2026, ' + b.ts.slice(6);
  document.getElementById('shMeta').textContent =
    'Strand ' + (b.sid+1) + '/' + SESSIONS.length + ' · Bead ' + (b.ord+1) + '/' + b.slen;
  const rows = [
    ['Phase', LEGEND.phase[b.phase]],
    ['Decision fatigue', LEGEND.fatigue[b.fatIdx]],
    ['Clarity', LEGEND.clarity[b.clarity]],
    ['Specificity', LEGEND.specificity[b.spec]],
    ['Groundedness', LEGEND.groundedness[b.ground]],
    ['Bundling', LEGEND.bundling[b.bundle]],
    ['Hour of day', LEGEND.hour[b.hour]],
    ['Shape', SHAPE_NAMES[b.shape]],
    ['Length', b.wc + ' words'],
    ['Pause before', fmtGap(b.gap)]
  ];
  document.getElementById('rows').innerHTML =
    rows.map(r => '<div class="k lbl">' + r[0] + '</div><div class="v">' + r[1] + '</div>').join('');
  sheet.classList.add('show');
}
document.getElementById('shClose').onclick = () => { sheet.classList.remove('show'); sel = null; draw(); };

/* ---------- key ---------- */
const legendEl = document.getElementById('legend');

const nf = new Intl.NumberFormat('en-GB');

function buildLegend(){
  const counts = LEGEND.phase.map(() => 0);
  for (const b of beads) counts[b.phase]++;

  document.getElementById('mCount').textContent =
    nf.format(beads.length) + ' prompts · ' + SESSIONS.length + ' sessions';

  legendEl.innerHTML = '';
  LEGEND.phase.forEach((lab, i) => {
    const d = document.createElement('div'); d.className = 'lg';
    const st = beadStyle({ phase:i, clarity:0, spec:0, ground:0, bundle:0 });
    const sp = makeSprite(30, SHAPE_PILL, st, 1, 3.2);
    const c = document.createElement('canvas');
    c.width = 38; c.height = Math.round(38 * sp.c.height / sp.c.width);
    const g = c.getContext('2d');
    g.drawImage(sp.c, 0, 0, c.width, c.height);
    d.appendChild(c);
    const s = document.createElement('span'); s.textContent = lab;
    d.appendChild(s);
    const n = document.createElement('span'); n.className = 'n';
    n.textContent = nf.format(counts[i]);
    d.appendChild(n);
    legendEl.appendChild(d);
  });

  document.getElementById('subkey').innerHTML =
    [['Polish', 'clarity'], ['Density', 'specificity'],
     ['Fleck / gold band', 'grounding'], ['Facets', 'bundling'],
     ['Length &amp; shape', 'word count'], ['Spacing', 'pause before']]
    .map(r => '<span><b>' + r[0] + '</b> ' + r[1] + '</span>').join('');
}

document.getElementById('zIn').onclick = () => { unlock(); cam.z = Math.min(Z_MAX, cam.z*1.6); clampCam(); draw(); };
document.getElementById('zOut').onclick = () => { cam.z = Math.max(minZ, cam.z/1.6); clampCam(); draw(); };
document.getElementById('zFit').onclick = () => { fit(); };

window.addEventListener('resize', resize);
const hint = document.getElementById('hint');
setTimeout(() => { hint.style.opacity = '0'; }, 6500);

buildLegend();
resize();
fit();
requestAnimationFrame(render);
</script>
</body>
